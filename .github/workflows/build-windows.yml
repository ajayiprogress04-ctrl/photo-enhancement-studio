
name: Build Photo Enhancement Studio for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "PhotoEnhancementStudio" --collect-all PySide6 --collect-all cv2 main.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler not found."
          }
          & $compiler installer.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed."
          }

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: PhotoEnhancementStudio-Portable
          path: dist/PhotoEnhancementStudio/
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PhotoEnhancementStudio-Installer
          path: |
            dist/installer/*.exe
            Output/*.exe
          if-no-files-found: error
