
name: Build Photo Enhancement Studio for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "PhotoEnhancementStudio" --collect-all PySide6 --collect-all cv2 main.py

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoEnhancementStudio-Windows
          path: dist/PhotoEnhancementStudio/
          if-no-files-found: error
